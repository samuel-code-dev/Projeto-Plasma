<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>Plasma</title>
</head>

<body>

    <div class="container">
        <main>
            <h1>p.l.a.s.m.a</h1>
            <div class="navegacao">
                <nav class="nav-bar">
                    <a href="#"><i class="fa-regular fa-house"></i>Início</a>
                    <a href="#"><i class="fa-regular fa-comment-dots"></i>Chat</a>
                    <a href="#"><i class="fa-solid fa-magnifying-glass"></i>Pesquisa</a>
                    <a href="#"><i class="fa-regular fa-folder"></i>Projetos</a>
                    <a href="#"><i class="fa-solid fa-book-open"></i>Biblioteca</a>
                    <a href="#"><i class="fa-regular fa-file"></i>Arquivo</a>
                    <a href="#"><i class="fa-solid fa-gear"></i>Configurações</a>
                </nav>
            </div>

            <div class="form">
                <h2>Por onde começamos?</h2>
                <input type="text" placeholder="Digite o que estiver pensando"> <i class="fa-solid fa-microphone"></i>
            </div>

            <div class="present">
                <i class="fa-solid fa-gift"></i>
                <h4>Ganhe 10% de desconto</h4>
            </div>

            <div class="plasma-brand">
                <img src="LUKL0547.JPG">
                <div>
                    <h2>P.L.A.S.M.A</h2>
                    <span>V1.0.0</span>
                    <p>Online</p>
                </div>
            </div>

            <div class="profile">
                <div>
                    <img src="LUKL0547.JPG" class="user">
                    <h2 class="name">Desenvolvedor</h2>
                    <span class="name-user">Usuário</span>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
